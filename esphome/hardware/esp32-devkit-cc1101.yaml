# Hardware: generic ESP32 DevKit (ESP32-WROOM-32) + 8-pin CC1101 module.
#
# Every pin is a substitution: to rewire, override it in your device file's
# `substitutions:` instead of editing this file. Defaults:
#
#   CC1101  ESP32
#   VCC     3V3   (3.3 V only)
#   GND     GND
#   SCK     GPIO18
#   MOSI    GPIO23
#   MISO    GPIO19
#   CSN     GPIO5
#   GDO0    GPIO4   (TX data)
#   GDO2    GPIO26  (RX data)

substitutions:
  esp32_board: esp32dev
  spi_clk_pin: GPIO18
  spi_mosi_pin: GPIO23
  spi_miso_pin: GPIO19
  cc1101_cs_pin: GPIO5
  cc1101_gdo0_pin: GPIO4
  cc1101_gdo2_pin: GPIO26

esp32:
  board: ${esp32_board}
  framework:
    type: esp-idf

# No network here: add `wifi:` in your device file (or a shared package).

spi:
  clk_pin: ${spi_clk_pin}
  mosi_pin: ${spi_mosi_pin}
  miso_pin: ${spi_miso_pin}
