# RF Network gateway: an ESP32 + CC1101 that sends and hears sub-GHz RF codes
# for the RF Network Home Assistant integration.
#
# Every gateway runs this same file; only the substitutions change. The
# gateway knows nothing about fans or shades: it transmits codes it is given
# and reports every code it decodes. The integration does the rest.
#
# After adding it in Home Assistant, open the ESPHome device's Configure
# dialog and enable "Allow the device to perform Home Assistant actions",
# otherwise received codes never reach Home Assistant.

substitutions:
  name: rf-gateway-1
  friendly_name: RF Gateway 1

  # Frequency of the remotes this gateway should hear and drive. The FCC
  # filing of an old remote can be off: tune live with the "RF Frequency"
  # box below and put the best value here.
  cc1101_frequency: "303"

  # rc_switch decoding. Fans on Bond template A3 use protocol 6, 12 bits.
  rc_code_bits: "12"

  # Transmit timing: protocol 6 shape at the remote's measured ~333 us unit.
  tx_pulse_length: "333"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key
  actions:
    # Called by RF Network. `code` is "<protocol>:<bits>".
    - action: transmit_rf_fan
      variables:
        action: string
        code: string
        repeat_count: int
      then:
        - remote_transmitter.transmit_rc_switch_raw:
            transmitter_id: rf_transmitter
            code: !lambda |-
              const std::string raw = code;
              const size_t sep = raw.find(':');
              return sep == std::string::npos ? raw : raw.substr(sep + 1);
            protocol:
              pulse_length: ${tx_pulse_length}
              sync: [23, 1]
              zero: [1, 2]
              one: [2, 1]
              inverted: true
            repeat:
              times: !lambda "return repeat_count;"
              wait_time: 10ms

ota:
  - platform: esphome
    password: !secret ota_password
    on_begin:
      then:
        - cc1101.set_idle

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

# For an Ethernet board (e.g. Waveshare ESP32-S3-ETH, W5500), replace `wifi:`
# with an `ethernet:` block and move the CC1101 to free pins.

spi:
  clk_pin: GPIO18   # CC1101 SCK
  mosi_pin: GPIO23  # CC1101 MOSI (SI)
  miso_pin: GPIO19  # CC1101 MISO (SO / GDO1)

cc1101:
  id: rf_radio
  cs_pin: GPIO5     # CC1101 CSN
  frequency: ${cc1101_frequency}MHz
  modulation_type: ASK/OOK
  filter_bandwidth: 812kHz

remote_transmitter:
  - id: rf_transmitter
    pin: GPIO4      # CC1101 GDO0
    carrier_duty_percent: 100%
    non_blocking: true
    on_transmit:
      then:
        - lambda: 'id(rf_tx_busy) = true;'
        - cc1101.begin_tx
    on_complete:
      then:
        - cc1101.begin_rx
        - lambda: 'id(rf_tx_busy) = false;'

remote_receiver:
  - id: rf_receiver
    pin: GPIO26     # CC1101 GDO2
    tolerance: 50%
    filter: 50us
    idle: 4ms
    dump: []
    on_rc_switch:
      then:
        - if:
            condition:
              api.connected:
            then:
              - homeassistant.event:
                  event: esphome.rf_fan_received
                  data_template:
                    device: ${name}
                    action: "sniff"
                    code: "{{ rc_code }}"
                  variables:
                    rc_code: !lambda |-
                      const int nbits = ${rc_code_bits};
                      std::string bits;
                      for (int i = nbits - 1; i >= 0; i--)
                        bits += ((x.code >> i) & 1) ? '1' : '0';
                      return std::to_string(x.protocol) + ":" + bits;

# The CC1101 only recalibrates when it re-enters RX; near the bottom of its
# range it drifts and goes deaf. Re-enter RX regularly.
globals:
  - id: rf_tx_busy
    type: bool
    initial_value: 'false'

interval:
  - interval: 30s
    then:
      - if:
          condition:
            lambda: 'return !id(rf_tx_busy);'
          then:
            - cc1101.begin_rx

number:
  - platform: template
    name: "RF Frequency (MHz)"
    entity_category: config
    min_value: 300
    max_value: 928
    step: 0.05
    initial_value: ${cc1101_frequency}
    optimistic: true
    mode: box
    set_action:
      - cc1101.set_frequency:
          value: !lambda "return x * 1e6;"
      - cc1101.begin_rx
