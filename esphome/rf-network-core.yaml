# RF Network gateway core: everything that does not depend on the board.
#
# The gateway knows nothing about brands or bit formats. It plays back raw
# pulse timings it is given, and reports the raw timings of everything it
# hears. The RF Network integration encodes and decodes using its templates,
# so new remotes never need new firmware.
#
# Include it together with ONE hardware file (see rf-gateway.example.yaml).
# The hardware file must define the SPI bus and these substitutions:
#   cc1101_cs_pin    CC1101 CSN
#   cc1101_gdo0_pin  CC1101 GDO0 (transmit data)
#   cc1101_gdo2_pin  CC1101 GDO2 (receive data)
#
# Override anything below in your gateway file's `substitutions:`.

substitutions:
  # The band this gateway listens on, in MHz. A CC1101 board is tuned for
  # one band (e.g. 315 or 433 MHz): put one gateway per band you need. Old
  # remotes drift from their FCC filing; tune live with the "RF Frequency"
  # box and put the best value here.
  cc1101_frequency: "303"
  cc1101_filter_bandwidth: 812kHz

  # Receiver tuning that worked at ~303 MHz. Larger values broke decoding.
  rx_filter: 50us
  rx_idle: 4ms
  # Captures with fewer pulses than this are noise and are not reported.
  rx_min_pulses: "16"

  # Pause between repeats of a frame when transmitting.
  tx_repeat_gap: 10ms

  # How often to re-enter RX so the CC1101 recalibrates (it drifts deaf).
  rx_recalibrate_interval: 30s

api:
  actions:
    # Called by RF Network: send one frame `repeat_count` times.
    # `timings` are microseconds, positive = carrier on, negative = off.
    # `frequency_mhz` retunes for this transmission only (0 = stay put).
    - action: rf_network_transmit
      variables:
        timings: int[]
        repeat_count: int
        frequency_mhz: float
      then:
        - if:
            condition:
              lambda: 'return frequency_mhz > 0 && (frequency_mhz - id(rf_listen_mhz) > 0.001f || id(rf_listen_mhz) - frequency_mhz > 0.001f);'
            then:
              - lambda: 'id(rf_retuned) = true;'
              - cc1101.set_frequency:
                  id: rf_radio
                  value: !lambda "return frequency_mhz * 1e6;"
        - remote_transmitter.transmit_raw:
            transmitter_id: rf_transmitter
            code: !lambda "return std::vector<int32_t>(timings.begin(), timings.end());"
            repeat:
              times: !lambda "return repeat_count;"
              wait_time: ${tx_repeat_gap}
  on_client_connected:
    - delay: 10s
    - script.execute: rf_hello

cc1101:
  id: rf_radio
  cs_pin: ${cc1101_cs_pin}
  frequency: ${cc1101_frequency}MHz
  modulation_type: ASK/OOK
  filter_bandwidth: ${cc1101_filter_bandwidth}

remote_transmitter:
  - id: rf_transmitter
    pin: ${cc1101_gdo0_pin}
    carrier_duty_percent: 100%
    non_blocking: true
    on_transmit:
      then:
        - lambda: 'id(rf_tx_busy) = true;'
        - cc1101.begin_tx: rf_radio
    on_complete:
      then:
        - if:
            condition:
              lambda: 'return id(rf_retuned);'
            then:
              - cc1101.set_frequency:
                  id: rf_radio
                  value: !lambda "return id(rf_listen_mhz) * 1e6;"
              - lambda: 'id(rf_retuned) = false;'
        - cc1101.begin_rx: rf_radio
        - lambda: 'id(rf_tx_busy) = false;'

remote_receiver:
  - id: rf_receiver
    pin: ${cc1101_gdo2_pin}
    tolerance: 50%
    filter: ${rx_filter}
    idle: ${rx_idle}
    # Set to [raw] to see captures in the log while debugging.
    dump: []
    on_raw:
      then:
        - if:
            condition:
              and:
                - api.connected:
                - lambda: 'return x.size() >= ${rx_min_pulses};'
            then:
              # Needs "Allow the device to perform Home Assistant actions"
              # enabled for this device in the ESPHome integration.
              - homeassistant.event:
                  event: esphome.rf_network_raw
                  data:
                    device: ${name}
                    frequency_mhz: !lambda 'return str_sprintf("%.3f", id(rf_listen_mhz));'
                    timings: !lambda |-
                      std::string out;
                      out.reserve(x.size() * 6);
                      for (size_t i = 0; i < x.size(); i++) {
                        if (i) out += ',';
                        out += std::to_string(x[i]);
                      }
                      return out;

script:
  # Tells RF Network this gateway exists and which band it listens on.
  - id: rf_hello
    then:
      - if:
          condition:
            api.connected:
          then:
            - homeassistant.event:
                event: esphome.rf_network_hello
                data:
                  device: ${name}
                  frequency_mhz: !lambda 'return str_sprintf("%.3f", id(rf_listen_mhz));'

globals:
  - id: rf_tx_busy
    type: bool
    initial_value: 'false'
  - id: rf_retuned
    type: bool
    initial_value: 'false'
  - id: rf_listen_mhz
    type: float
    initial_value: '${cc1101_frequency}'

interval:
  - interval: ${rx_recalibrate_interval}
    then:
      - if:
          condition:
            lambda: 'return !id(rf_tx_busy);'
          then:
            - cc1101.begin_rx: rf_radio
  - interval: 5min
    then:
      - script.execute: rf_hello

number:
  - platform: template
    name: "RF Frequency (MHz)"
    entity_category: config
    min_value: 300
    max_value: 928
    step: 0.05
    initial_value: ${cc1101_frequency}
    optimistic: true
    mode: box
    set_action:
      - lambda: 'id(rf_listen_mhz) = x;'
      - cc1101.set_frequency:
          id: rf_radio
          value: !lambda "return x * 1e6;"
      - cc1101.begin_rx: rf_radio
      - script.execute: rf_hello

button:
  - platform: template
    name: "RF Recalibrate"
    entity_category: config
    on_press:
      - cc1101.begin_rx: rf_radio
